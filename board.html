<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amsterdam Bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { paper: '#EFEAE0', paper2: '#E7E0D2', ink: '#26313F', orange: '#EA6A2E', teal: '#2E6B62', stamp: '#B8432E' },
        fontFamily: {
          display: ['Fraunces', 'serif'],
          body: ['"Source Sans 3"', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'monospace'],
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen font-body text-ink">

  <div class="max-w-3xl mx-auto px-4 py-10 sm:py-14">

    <header class="mb-6 flex items-start justify-between gap-4">
      <div>
        <p class="font-mono text-xs tracking-[0.25em] uppercase text-teal mb-2">
          <a href="index.html" class="hover:text-orange transition-colors">&larr; Reisdagboek</a>
        </p>
        <h1 id="board-title" class="font-display text-4xl sm:text-5xl font-semibold leading-tight text-ink">Loading&hellip;</h1>
        <p id="board-subtitle" class="font-mono text-sm text-ink/60 mt-2"></p>
      </div>
      <div class="hidden sm:flex flex-col items-center justify-center w-20 h-20 rounded-full stamp-ring postmark-spin shrink-0 mt-1">
        <span class="text-[9px] leading-tight tracking-wider">NL &bull; 2026</span>
      </div>
    </header>

    <!-- Share code -->
    <div class="postcard-card rounded-sm px-4 py-3 mb-5 flex items-center justify-between gap-3 flex-wrap">
      <div class="font-mono text-xs text-ink/60">
        Share code: <span id="board-code" class="text-ink font-semibold tracking-widest">&mdash;</span>
      </div>
      <button id="copy-link" class="font-mono text-xs text-teal underline decoration-dotted underline-offset-4 hover:text-orange transition-colors">copy link</button>
    </div>

    <!-- Status bar -->
    <div class="flex items-center justify-between mb-5 font-mono text-xs text-ink/60">
      <span id="progress-text">&mdash; / 25 stamped</span>
      <button id="reset-btn" class="underline decoration-dotted underline-offset-4 hover:text-orange transition-colors">reset board</button>
    </div>

    <!-- Bingo win banner -->
    <div id="win-banner" class="hidden mb-5 bg-orange text-paper font-display font-semibold text-center py-3 rounded-sm bingo-glow">
      BINGO! &mdash; line complete
    </div>

    <div id="error-banner" class="hidden mb-5 bg-stamp text-paper font-mono text-sm text-center py-3 rounded-sm"></div>

    <!-- Grid -->
    <div id="grid" class="grid grid-cols-5 gap-2 sm:gap-3 mb-8"></div>

    <footer class="text-center font-mono text-[11px] text-ink/40 leading-relaxed">
      <p>This board updates for everyone with the link every few seconds.</p>
    </footer>

  </div>

  <script src="board-app.js"></script>
</body>
</html>
